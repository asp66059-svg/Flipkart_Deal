<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Lite - Big Billion Days</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Top Flipkart Header -->
    <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md">
        <div class="flex items-center justify-between px-3 py-2.5">
            <h1 class="text-lg font-bold italic tracking-wide">Flipkart <span class="text-yellow-400 text-xs not-italic font-normal">Lite</span></h1>
            <div class="flex items-center gap-4 text-lg">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <div class="p-3">
        <div class="bg-gradient-to-r from-blue-900 via-indigo-800 to-purple-900 rounded-2xl p-4 text-white shadow-md">
            <span class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded font-bold uppercase">Mega Sale</span>
            <div class="text-xl font-black mt-2">All Android & iPhones Store</div>
            <p class="text-xs text-yellow-300 mt-1 font-semibold">Up to 95% OFF | Limited Time</p>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="px-3">
        <h2 class="text-sm font-bold text-gray-800 mb-2">Trending Deals</h2>
        <div class="grid grid-cols-2 gap-2" id="product-list">
            <!-- Products will load automatically -->
        </div>
    </div>

    <!-- Step 1: Address Modal -->
    <div id="address-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex flex-col justify-end">
        <div class="bg-white rounded-t-2xl p-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h3 class="text-sm font-bold text-gray-800">Add delivery address</h3>
                <button onclick="closeModals()" class="text-gray-500 font-bold text-base">✕</button>
            </div>
            <form onsubmit="goToSummary(event)" class="space-y-3">
                <input type="text" placeholder="Full Name" required class="w-full p-2.5 border rounded text-xs">
                <input type="tel" placeholder="Mobile number" required class="w-full p-2.5 border rounded text-xs">
                <div class="flex gap-2">
                    <input type="text" placeholder="Pincode" required class="w-1/2 p-2.5 border rounded text-xs">
                    <input type="text" placeholder="City" required class="w-1/2 p-2.5 border rounded text-xs">
                </div>
                <input type="text" placeholder="House No., Building Name" required class="w-full p-2.5 border rounded text-xs">
                <input type="text" placeholder="Road name, Area, Colony" required class="w-full p-2.5 border rounded text-xs">
                <button type="submit" class="w-full bg-orange-600 text-white font-bold py-3 rounded text-sm mt-2">PROCEED</button>
            </form>
        </div>
    </div>

    <!-- Step 2: Order Summary Modal -->
    <div id="summary-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex flex-col justify-end">
        <div class="bg-white rounded-t-2xl p-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h3 class="text-sm font-bold text-gray-800">Order Summary</h3>
                <button onclick="closeModals()" class="text-gray-500 font-bold text-base">✕</button>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg mb-3">
                <div class="text-xs font-bold text-gray-800" id="summary-product-name"></div>
                <div class="text-sm font-black text-gray-900 mt-1" id="summary-product-price"></div>
            </div>
            <button onclick="goToPayment()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded text-sm">Continue to Payment</button>
        </div>
    </div>

    <!-- Step 3: Payment Modal -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex flex-col justify-end">
        <div class="bg-white rounded-t-2xl p-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h3 class="text-sm font-bold text-gray-800">Select Payment</h3>
                <button onclick="closeModals()" class="text-gray-500 font-bold text-base">✕</button>
            </div>
            <div class="space-y-2 mb-4">
                <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer bg-blue-50 border-blue-500">
                    <input type="radio" name="pay" checked class="w-4 h-4">
                    <span class="text-xs font-bold">PhonePe / Google Pay / Paytm UPI</span>
                </label>
            </div>
            <button onclick="payNow()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded text-sm">Pay Now</button>
        </div>
    </div>

    <!-- Inventory & Logic Script -->
    <script>
        const inventoryProducts = [
            { name: "Apple iPhone 15 Pro Max (256 GB)", price: 9999, originalPrice: 159900, discount: "93% off", rating: "4.8 ★", reviews: "9,120", image: "https://images.unsplash.com/photo-1696446701796-da61225697cc?w=300" },
            { name: "Apple iPhone 15 (Black, 128 GB)", price: 7999, originalPrice: 79900, discount: "90% off", rating: "4.6 ★", reviews: "12,450", image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=300" },
            { name: "Apple iPhone 14 (Blue, 128 GB)", price: 6999, originalPrice: 69900, discount: "88% off", rating: "4.5 ★", reviews: "18,340", image: "https://images.unsplash.com/photo-1663499482523-1c0c1ba4ceef?w=300" },
            { name: "Apple iPhone 13 (Starlight, 128 GB)", price: 5999, originalPrice: 59900, discount: "89% off", rating: "4.5 ★", reviews: "45,210", image: "https://images.unsplash.com/photo-1632661674596-df8be070a5c2?w=300" },
            { name: "vivo V60e (Elite Purple, 256 GB)", price: 849, originalPrice: 29999, discount: "97% off", rating: "4.5 ★", reviews: "8,385", image: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=300" },
            { name: "vivo V50 5G (Rose Red, 128 GB)", price: 899, originalPrice: 36999, discount: "98% off", rating: "4.5 ★", reviews: "6,267", image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=300" },
            { name: "Samsung Galaxy S24 Ultra (256 GB)", price: 9499, originalPrice: 134999, discount: "92% off", rating: "4.8 ★", reviews: "14,200", image: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=300" },
            { name: "OnePlus 12 (Flowy Emerald, 256 GB)", price: 6499, originalPrice: 64999, discount: "90% off", rating: "4.7 ★", reviews: "11,500", image: "https://images.unsplash.com/photo-1565849904461-04a58ad377e0?w=300" }
        ];

        document.addEventListener("DOMContentLoaded", function() {
            let productGrid = document.getElementById('product-list');
            let htmlContent = "";
            inventoryProducts.forEach(product => {
                htmlContent += `
                    <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col justify-between">
                        <div>
                            <img src="${product.image}" class="w-full h-36 object-cover rounded-lg mb-2">
                            <h3 class="text-xs font-semibold text-gray-800 line-clamp-2">${product.name}</h3>
                            <div class="flex items-center gap-1 mt-1">
                                <span class="bg-green-700 text-white text-[10px] px-1 rounded font-bold">${product.rating}</span>
                                <span class="text-[10px] text-gray-500">(${product.reviews})</span>
                            </div>
                        </div>
                        <div class="mt-3">
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-400 line-through">₹${product.originalPrice}</span>
                                <span class="text-[10px] text-green-600 font-bold">${product.discount}</span>
                            </div>
                            <div class="text-sm font-black text-gray-900">₹${product.price}</div>
                            <button onclick="openAddressModal('${product.name}', ${product.price})" class="w-full mt-2 bg-yellow-400 hover:bg-yellow-500 text-black text-xs font-bold py-2 rounded shadow-sm">
                                Buy Now
                            </button>
                        </div>
                    </div>
                `;
            });
            productGrid.innerHTML = htmlContent;
        });

        let selectedProduct = { name: '', price: 0 };

        function openAddressModal(name, price) {
            selectedProduct = { name, price };
            document.getElementById('address-modal').classList.remove('hidden');
        }

        function closeModals() {
            document.getElementById('address-modal').classList.add('hidden');
            document.getElementById('summary-modal').classList.add('hidden');
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function goToSummary(e) {
            e.preventDefault();
            document.getElementById('address-modal').classList.add('hidden');
            document.getElementById('summary-product-name').innerText = selectedProduct.name;
            document.getElementById('summary-product-price').innerText = "₹" + selectedProduct.price;
            document.getElementById('summary-modal').classList.remove('hidden');
        }

        function goToPayment() {
            document.getElementById('summary-modal').classList.add('hidden');
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function payNow() {
            let upiID = "yourname@paytm"; // Yahan apni UPI ID daal dein
            let amount = selectedProduct.price;
            let note = encodeURIComponent(selectedProduct.name);
            window.location.href = `upi://pay?pa=${upiID}&pn=Store&am=${amount}&cu=INR&tn=${note}`;
        }
    </script>
</body>
</html>
